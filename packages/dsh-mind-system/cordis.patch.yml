- insert:
    # 心智系统 · 合成包（四家源码并入，一个包一次装齐）
    # 顺序不能随意：
    # 1. clis 四组件 → clis 工具包（工具包 inject 依赖那四个服务，
    #    服务没就位时工具包不激活）
    # 2. meta-framework → 依赖 clis 的分类器（ctx.get 取服务）
    # 3. memory-manager → 自足
    # 4. mind → 最后（需要 tools 与 systemPrompt 都已就位）
    # 插件 id（面板/探针显示）来自各入口模块的 name 导出，保持不变。
    - id: clis-classifier
      name: 'dsh-mind-system/clis-classifier'
      config: {}
    - id: clis-strategy
      name: 'dsh-mind-system/clis-strategy'
      config: {}
    - id: clis-feedback
      name: 'dsh-mind-system/clis-feedback'
      config: {}
    - id: clis-orchestrator
      name: 'dsh-mind-system/clis-orchestrator'
      config: {}
    - id: clis-tools
      name: 'dsh-mind-system/clis'
      config: {}
    - id: meta-framework
      name: 'dsh-mind-system/meta-framework'
      config: {}
    - id: memory-manager
      name: 'dsh-mind-system/memory-manager'
      config: {}
    - id: mind
      name: 'dsh-mind-system/agent-mind'
      config: {}
    - id: mind-system
      name: 'dsh-mind-system'
      config: {}
