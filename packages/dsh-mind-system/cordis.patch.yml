- insert:
    # 心智系统 · 合成包（四家源码并入，一个包一次装齐）
    # 顺序不能随意：
    # 1. clis 四组件 → clis 工具包（工具包 inject 依赖那四个服务，
    #    服务没就位时工具包不激活）
    # 2. meta-framework → 依赖 clis 的分类器（ctx.get 取服务）
    # 3. valves → 发布 'valves' 服务（memory 经 ctx.get 可选探测）
    # 4. memory-manager → 自足（valves 缺了照常工作）
    # 5. mind → 最后（需要 tools 与 systemPrompt 都已就位）
    # 插件 id（面板/探针显示）来自各入口模块的 name 导出，保持不变。
    - id: clis-classifier
      name: 'dsh-mind-system/clis-classifier'
      config: {}
    - id: clis-strategy
      name: 'dsh-mind-system/clis-strategy'
      config: {}
    - id: clis-feedback
      name: 'dsh-mind-system/clis-feedback'
      config: {}
    - id: clis-orchestrator
      name: 'dsh-mind-system/clis-orchestrator'
      config: {}
    - id: clis-tools
      name: 'dsh-mind-system/clis'
      config: {}
    - id: meta-framework
      name: 'dsh-mind-system/meta-framework'
      config: {}
    - id: valves
      name: 'dsh-mind-system/valves'
      config: {}
    - id: memory-manager
      name: 'dsh-mind-system/memory-manager'
      config: {}
    - id: mind
      name: 'dsh-mind-system/agent-mind'
      config: {}
    # 6. Dual-loop execution runtime: requires tools and the calling agent to be in place
    #    (each invocation takes its caller identity from exec.agent).
    #    Enabled here so real tasks start flowing through it and cross-task evidence can accumulate.
    #    Registers runtime_status / runtime_run (declared templates only) and runtime_execute /
    #    runtime_verifiers (tasks described at runtime). Acceptance and branching are closed
    #    vocabularies, so the actor being judged never authors its own acceptance rule.
    - id: execution-runtime
      name: 'dsh-mind-system/runtime'
      config:
        enabled: true
        tasks: []
    - id: mind-system
      name: 'dsh-mind-system'
      config: {}
