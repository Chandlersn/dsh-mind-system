    # 心智系统 · 聚合装载点
    #
    # 本包**装载四个成员**，是它们唯一的装载入口。
    #
    # ## 为什么聚合包要装载它们（实测结论，2026-11-02）
    #
    # 试过两种形态，各做一次重启验证：
    #
    # **形态 A（聚合包不装载四家）**：单独装聚合包 = 四家全都不在
    # （实测：clis_probe 消失，user_plugins 从 15 掉到 14）。
    # 聚合包成了空壳 —— 不可接受。
    #
    # **形态 B（聚合包装载四家，四家也在 bundles 里）**：双装载。
    # 实测：同一 id 的装载点由后者覆盖，四家正常但**聚合包自己被挤掉**
    # （user_plugins 14，mind-system 从列表消失）。
    # 装出来的形态与预期不符 —— 不可接受。
    #
    # **形态 C（本文件采用）**：聚合包装载四家，四家**不在** bundles 里。
    # 唯一入口、零重复。代价：使用者若再单独装某家，那家会双装载
    # （同 id 覆盖，仍能工作，但行为取决于装载顺序）—— README 已写明。
    #
    # ## 顺序不能随便
    #
    # 1. clis 四组件 → clis-tools：工具包 inject 依赖那四个服务，
    #    服务没就位时工具包不激活（宿主只报 "1 entry did not activate"）
    # 2. meta-framework → 依赖 clis 的分类器（ctx.get 取服务）
    # 3. memory-manager → 自足
    # 4. mind → 需要 tools 与 systemPrompt 都已就位
    #
    # 缺哪一家，缺的那部分能力就不在（降级，不是报错）。
    - id: clis-classifier
      name: 'dsh-clis/classifier'
      config: {}
    - id: clis-strategy
      name: 'dsh-clis/strategy'
      config: {}
    - id: clis-feedback
      name: 'dsh-clis/feedback'
      config: {}
    - id: clis-orchestrator
      name: 'dsh-clis/orchestrator'
      config: {}
    - id: clis-tools
      name: 'dsh-clis'
      config: {}
    - id: meta-framework
      name: 'dsh-meta-framework'
      config: {}
    - id: memory-manager
      name: 'dsh-memory-manager'
      config: {}
    - id: mind
      name: 'dsh-agent-mind'
      config: {}
    - id: mind-system
      name: 'dsh-mind-system'
      config: {}
