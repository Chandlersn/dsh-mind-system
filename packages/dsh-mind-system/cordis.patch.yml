- insert:
    # 心智系统 · 合成包（四家源码并入，一个包一次装齐）
    # 顺序不能随意：
    # 1. clis 四组件 → clis 工具包（工具包 inject 依赖那四个服务，
    #    服务没就位时工具包不激活）
    # 2. meta-framework → 依赖 clis 的分类器（ctx.get 取服务）
    # 3. valves → 发布 'valves' 服务（memory 经 ctx.get 可选探测）
    # 4. memory-manager → 自足（valves 缺了照常工作）
    # 5. mind → 最后（需要 tools 与 systemPrompt 都已就位）
    # 插件 id（面板/探针显示）来自各入口模块的 name 导出，保持不变。
    - id: clis-classifier
      name: 'dsh-mind-system/clis-classifier'
      config: {}
    - id: clis-strategy
      name: 'dsh-mind-system/clis-strategy'
      config: {}
    - id: clis-feedback
      name: 'dsh-mind-system/clis-feedback'
      config: {}
    - id: clis-orchestrator
      name: 'dsh-mind-system/clis-orchestrator'
      config: {}
    - id: clis-tools
      name: 'dsh-mind-system/clis'
      config: {}
    - id: meta-framework
      name: 'dsh-mind-system/meta-framework'
      config: {}
    - id: valves
      name: 'dsh-mind-system/valves'
      config: {}
    - id: memory-manager
      name: 'dsh-mind-system/memory-manager'
      config: {}
    - id: mind
      name: 'dsh-mind-system/agent-mind'
      config: {}
    - id: mind-system
      name: 'dsh-mind-system'
      config: {}
    # 双循环执行运行时：默认关闭。
    # 关闭时只装载适配层、不注册任何工具，健康探针报告 disabled —— 装了等于没装，
    # 不改变现有行为。要启用须显式给 enabled:true 与 agent（执行器必须有明确调用者身份），
    # 并按需在 tasks 里声明模板任务；没有声明任务时探针报告 no-tasks 而非假装可用。
    - id: execution-runtime
      name: 'dsh-mind-system/runtime'
      config:
        enabled: false
